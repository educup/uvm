# Routine updates run monthly; security updates remain separate.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        applies-to: version-updates
        patterns: ["*"]
